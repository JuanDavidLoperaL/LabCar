<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio · LAB CAR</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
    <script type="module" src="../ts/pages/inicio.ts"></script>
  </head>
  <!-- "invisible" evita mostrar la página antes de validar la sesión -->
  <body class="invisible bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen">
    <header class="flex items-center justify-between px-margin-mobile lg:px-margin py-space-md bg-surface-container-low">
      <div class="flex items-center gap-space-sm">
        <img src="../assets/images/logo.png" alt="LAB CAR" class="h-8 w-auto" />
        <span class="font-label-lg text-label-lg">LAB CAR</span>
      </div>
      <div class="flex items-center gap-space-md">
        <span id="user-name" class="font-body-sm text-body-sm text-on-surface-variant hidden sm:inline"></span>
        <button id="btn-logout" type="button" class="flex items-center gap-1 font-label-md text-label-md text-primary hover:underline">
          <span class="material-symbols-outlined text-lg" aria-hidden="true">logout</span>Cerrar sesión
        </button>
      </div>
    </header>
    <main class="px-margin-mobile lg:px-margin py-space-xl">
      <h1 id="welcome" class="font-headline-lg text-headline-lg">Bienvenido</h1>
      <p class="mt-space-sm text-on-surface-variant">Aquí irá el panel principal del sistema.</p>
    </main>
  </body>
</html>
